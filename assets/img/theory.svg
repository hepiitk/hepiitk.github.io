<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Line drawing of a one-loop Feynman diagram">
  <title>Particle theory</title>
  <rect width="480" height="300" fill="#fbfaf6"/>
  <g fill="none" stroke="#c5bfae" stroke-width="0.8">
    <path d="M0 250h480M0 60h480" opacity=".45"/>
  </g>

  <!-- incoming fermion lines -->
  <g fill="none" stroke="#101216" stroke-width="1.6" stroke-linecap="round">
    <path d="M40 80 L150 150"/>
    <path d="M40 220 L150 150"/>
    <path d="M330 150 L440 80"/>
    <path d="M330 150 L440 220"/>
  </g>
  <!-- direction arrows -->
  <g fill="#101216">
    <path d="M92 113 l14 2 -11 8 z"/>
    <path d="M92 187 l11 8 -14 2 z"/>
    <path d="M388 113 l-14 2 11 8 z" opacity=".9"/>
    <path d="M388 187 l-11 8 14 2 z" opacity=".9"/>
  </g>

  <!-- the loop -->
  <ellipse cx="240" cy="150" rx="90" ry="58" fill="none" stroke="#7d1f2c" stroke-width="1.8"/>
  <ellipse cx="240" cy="150" rx="90" ry="58" fill="none" stroke="#7d1f2c" stroke-width="6" opacity=".08"/>

  <!-- exchanged boson: wavy line across the loop -->
  <path d="M150 150 q12 -16 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0"
        fill="none" stroke="#1d3557" stroke-width="1.5" stroke-linecap="round"/>

  <!-- vertices -->
  <g fill="#101216">
    <circle cx="150" cy="150" r="5"/>
    <circle cx="330" cy="150" r="5"/>
  </g>
  <g fill="none" stroke="#7d1f2c" stroke-width="0.9" opacity=".65">
    <circle cx="150" cy="150" r="12"/>
    <circle cx="330" cy="150" r="12"/>
  </g>

  <!-- external leg labels, drawn as small ticks -->
  <g stroke="#8a6a24" stroke-width="1.2" stroke-linecap="round">
    <path d="M36 74 l0 12M36 214 l0 12M444 74 l0 12M444 214 l0 12"/>
  </g>
</svg>
