<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Line drawing of an anti-de Sitter cylinder with a boundary theory and a geodesic through the bulk">
  <title>String theory and holography</title>
  <rect width="480" height="300" fill="#fbfaf6"/>

  <!-- the AdS cylinder -->
  <g fill="none" stroke="#101216" stroke-width="1.4">
    <ellipse cx="240" cy="62" rx="150" ry="40"/>
    <path d="M90 62v176M390 62v176"/>
    <path d="M90 238a150 40 0 0 0 300 0" />
  </g>
  <path d="M90 238a150 40 0 0 1 300 0" fill="none" stroke="#c5bfae" stroke-width="1" stroke-dasharray="6 5"/>

  <!-- radial slices of the bulk -->
  <g fill="none" stroke="#ded9cd" stroke-width="1">
    <ellipse cx="240" cy="122" rx="150" ry="40"/>
    <ellipse cx="240" cy="182" rx="150" ry="40"/>
  </g>

  <!-- boundary CFT: a wave running around the top rim -->
  <path d="M96 56 q18 -14 36 2 t36 2 t36 -4 t36 0 t36 2 t36 -2 t36 0"
        fill="none" stroke="#7d1f2c" stroke-width="1.6" stroke-linecap="round"/>

  <!-- two boundary operators and the geodesic joining them through the bulk -->
  <g fill="#7d1f2c">
    <circle cx="126" cy="70" r="4.5"/>
    <circle cx="354" cy="70" r="4.5"/>
  </g>
  <path d="M126 70 C168 176 312 176 354 70" fill="none" stroke="#1d3557" stroke-width="1.7"/>
  <path d="M126 70 C168 176 312 176 354 70" fill="none" stroke="#1d3557" stroke-width="7" opacity=".08"/>

  <!-- a closed string worldsheet tube descending into the bulk -->
  <g fill="none" stroke="#8a6a24" stroke-width="1.2">
    <path d="M214 96 C206 150 210 196 226 232"/>
    <path d="M266 96 C274 150 270 196 254 232"/>
    <ellipse cx="240" cy="96" rx="26" ry="8"/>
    <ellipse cx="240" cy="234" rx="14" ry="5" stroke-dasharray="4 4"/>
  </g>

  <!-- horizon hint at the centre of the bulk -->
  <circle cx="240" cy="182" r="5" fill="#101216"/>
  <circle cx="240" cy="182" r="13" fill="none" stroke="#101216" stroke-width="0.8" opacity=".45"/>
</svg>
