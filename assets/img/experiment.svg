<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Line drawing of a cylindrical collider detector with a beam line and two jet cones">
  <title>Particle experiments</title>
  <rect width="480" height="300" fill="#fbfaf6"/>

  <!-- beam line -->
  <path d="M10 150h460" fill="none" stroke="#c5bfae" stroke-width="1" stroke-dasharray="7 6"/>

  <!-- detector barrel: two end ellipses plus the top and bottom edges -->
  <g fill="none" stroke="#101216" stroke-width="1.4">
    <ellipse cx="140" cy="150" rx="30" ry="104"/>
    <ellipse cx="340" cy="150" rx="30" ry="104"/>
    <path d="M140 46h200M140 254h200"/>
  </g>
  <!-- calorimeter layers -->
  <g fill="none" stroke="#c5bfae" stroke-width="1">
    <ellipse cx="140" cy="150" rx="22" ry="76"/>
    <ellipse cx="140" cy="150" rx="14" ry="48"/>
    <ellipse cx="140" cy="150" rx="6" ry="20"/>
    <path d="M140 74h200M140 226h200M140 102h200M140 198h200" opacity=".7"/>
  </g>
  <!-- segment ticks along the barrel -->
  <g stroke="#ded9cd" stroke-width="1">
    <path d="M180 46v208M220 46v208M260 46v208M300 46v208"/>
  </g>

  <!-- interaction point -->
  <circle cx="240" cy="150" r="4" fill="#101216"/>

  <!-- jet cones out of the interaction point -->
  <g fill="none" stroke="#7d1f2c" stroke-width="1.3">
    <path d="M240 150 L392 66 L402 96 Z" fill="#7d1f2c" fill-opacity=".07"/>
    <path d="M240 150 L120 244 L104 218 Z" fill="#7d1f2c" fill-opacity=".07"/>
  </g>
  <!-- tracks inside the cones -->
  <g fill="none" stroke="#1d3557" stroke-width="1" stroke-linecap="round" opacity=".85">
    <path d="M240 150 C300 132 350 100 396 78"/>
    <path d="M240 150 C298 142 348 112 398 90"/>
    <path d="M240 150 C190 186 150 214 112 236"/>
    <path d="M240 150 C196 178 152 206 108 226"/>
  </g>
  <!-- stray low-momentum tracks -->
  <g fill="none" stroke="#8a6a24" stroke-width="0.9" stroke-linecap="round" opacity=".8">
    <path d="M240 150 C258 118 260 92 250 62"/>
    <path d="M240 150 C222 184 214 214 222 240"/>
  </g>
</svg>
