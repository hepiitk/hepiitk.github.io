    <rect x="270" y="214" width="104" height="18" rx="2"/>
    <rect x="276" y="196" width="94" height="18" rx="2"/>
    <rect x="266" y="178" width="100" height="18" rx="2"/>
  </g>
  <g fill="none" stroke-width="1.2">
    <path d="M286 214 v18M354 214 v18" stroke="#7d1f2c"/>
    <path d="M290 196 v18M350 196 v18" stroke="#1d3557"/>
    <path d="M280 178 v18M346 178 v18" stroke="#8a6a24"/>
  </g>
  <path d="M276 178 l8 -26 h70 l-6 26 z" fill="#fffdf8" stroke="#101216" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M290 172 c10 0 12 -14 22 -14 s12 14 26 14" fill="none" stroke="#7d1f2c" stroke-width="1.2"/>

  <!-- table -->
  <path d="M30 242 h360" stroke="#101216" stroke-width="1.4"/>
