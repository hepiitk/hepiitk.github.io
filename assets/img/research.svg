<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" role="img" aria-label="Line drawing of an armillary sphere, with its rings and a small sun at the centre, beside a stack of books">
  <title>Research</title>
  <rect width="420" height="276" fill="#fbfaf6"/>

  <!-- stars -->
  <g fill="none" stroke="#c5bfae" stroke-width="1">
    <path d="M44 42 v8M40 46 h8M300 30 v8M296 34 h8M370 70 v6M367 73 h6M36 150 v6M33 153 h6M282 96 v6M279 99 h6"/>
  </g>

  <!-- the armillary sphere -->
  <ellipse cx="168" cy="116" rx="33.6" ry="80" transform="rotate(0 168 116)" fill="none" stroke="#c5bfae" stroke-width="1" opacity="1"/>
  <ellipse cx="168" cy="116" rx="64.0" ry="80" transform="rotate(0 168 116)" fill="none" stroke="#c5bfae" stroke-width="0.9" opacity="1" stroke-dasharray="2 4"/>
  <circle cx="168" cy="116" r="80" fill="none" stroke="#101216" stroke-width="1.5"/>
  <circle cx="168" cy="116" r="75" fill="none" stroke="#101216" stroke-width="0.8" opacity=".5"/>
  <ellipse cx="168" cy="116" rx="80" ry="20" transform="rotate(0 168 116)" fill="none" stroke="#101216" stroke-width="1.3" opacity="1"/>
  <ellipse cx="168" cy="116" rx="80" ry="26" transform="rotate(-18 168 116)" fill="none" stroke="#7d1f2c" stroke-width="1.6" opacity="1"/>
  <ellipse cx="168" cy="116" rx="22.400000000000002" ry="80" transform="rotate(-23 168 116)" fill="none" stroke="#1d3557" stroke-width="1.4" opacity="1"/>
  <path d="M129.7 25.8 L206.3 206.2" stroke="#8a6a24" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="168" cy="116" r="10" fill="#8a6a24" fill-opacity=".35" stroke="#8a6a24" stroke-width="1.3"/>
  <circle cx="235.3" cy="109.6" r="4" fill="#1d3557"/>
  <circle cx="96.2" cy="127.2" r="3" fill="#7d1f2c"/>

  <!-- stand -->
  <g fill="#f4f2ea" stroke="#101216" stroke-width="1.4" stroke-linejoin="round">
    <path d="M162 196 c0 14 -8 22 -8 34 h28 c0 -12 -8 -20 -8 -34 z"/>
    <path d="M124 242 q44 -20 88 0 z"/>
