<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" role="img" aria-label="Line drawing of a blackboard with an equation and a lectern">
  <title>Seminars</title>
  <rect width="420" height="276" fill="#fbfaf6"/>

  <!-- blackboard -->
  <rect x="42" y="26" width="336" height="168" rx="3" fill="#f4f2ea" stroke="#101216" stroke-width="1.4"/>
  <rect x="42" y="194" width="336" height="9" rx="2" fill="#ded9cd" stroke="#101216" stroke-width="1.1"/>

  <!-- chalk marks: an action, a loop integral, a diagram -->
  <g fill="none" stroke="#7d1f2c" stroke-width="1.5" stroke-linecap="round">
    <path d="M66 62 h22M77 52 v20"/>
    <path d="M100 58 q10 -10 18 0 t18 0"/>
    <path d="M146 50 c-10 8 -10 16 0 24M176 50 c10 8 10 16 0 24"/>
    <path d="M156 56 h12M162 50 v12"/>
  </g>
  <g fill="none" stroke="#1d3557" stroke-width="1.3" stroke-linecap="round">
    <path d="M66 100 c8 -12 8 22 0 10"/>
    <path d="M84 104 h30M84 112 h22"/>
    <path d="M132 96 l0 22M132 96 l16 22M148 96 l0 22"/>
    <path d="M170 108 h26M183 98 v20"/>
  </g>
  <!-- small feynman sketch on the right of the board -->
  <g fill="none" stroke="#101216" stroke-width="1.3">
    <path d="M232 140 l26 -16M232 172 l26 16M310 124 l-26 16M310 188 l-26 -16"/>
    <ellipse cx="271" cy="156" rx="13" ry="16"/>
  </g>
  <g fill="none" stroke="#8a6a24" stroke-width="1.2" stroke-linecap="round">
    <path d="M232 76 q9 -9 18 0 t18 0 t18 0 t18 0"/>
    <path d="M232 96 h72"/>
  </g>

  <!-- lectern -->
  <g fill="none" stroke="#101216" stroke-width="1.4">
    <path d="M182 232 l56 0 -8 -26 -40 0 z" fill="#f4f2ea"/>
    <path d="M210 206 v-8"/>
    <path d="M150 240 h120"/>
  </g>
  <!-- a couple of seat backs in the foreground -->
  <g fill="none" stroke="#c5bfae" stroke-width="1.3">
    <path d="M56 248 q18 -14 36 0M104 248 q18 -14 36 0M280 248 q18 -14 36 0M328 248 q18 -14 36 0"/>
  </g>
</svg>
