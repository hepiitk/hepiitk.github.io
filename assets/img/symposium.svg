<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" role="img" aria-label="Line drawing of an auditorium with a projection screen and rows of seats">
  <title>Conferences and workshops</title>
  <rect width="420" height="276" fill="#fbfaf6"/>

  <!-- projection screen with a plot on it -->
  <rect x="96" y="22" width="228" height="124" rx="2" fill="#f4f2ea" stroke="#101216" stroke-width="1.4"/>
  <path d="M210 146v10" stroke="#101216" stroke-width="1.2"/>
  <g fill="none" stroke="#c5bfae" stroke-width="0.9">
    <path d="M124 122h172M124 96h172M124 70h172"/>
  </g>
  <g fill="none" stroke="#101216" stroke-width="1.2">
    <path d="M124 46v90h172"/>
  </g>
  <!-- a resonance curve and data points -->
  <path d="M130 130 C164 128 182 124 196 74 C206 44 216 44 226 74 C240 122 262 130 292 132"
        fill="none" stroke="#7d1f2c" stroke-width="1.6"/>
  <g fill="#1d3557">
    <circle cx="150" cy="129" r="2.2"/><circle cx="176" cy="124" r="2.2"/>
    <circle cx="196" cy="88" r="2.2"/><circle cx="211" cy="58" r="2.2"/>
    <circle cx="228" cy="86" r="2.2"/><circle cx="252" cy="124" r="2.2"/>
    <circle cx="278" cy="130" r="2.2"/>
  </g>

  <!-- speaker at the side of the screen -->
  <g fill="none" stroke="#101216" stroke-width="1.4">
    <circle cx="352" cy="112" r="10"/>
    <path d="M352 122v30M352 134l-14 12M352 134l14 12M352 152l-10 22M352 152l10 22"/>
  </g>
  <path d="M330 100 l-14 -10" stroke="#8a6a24" stroke-width="1.3" fill="none"/>

  <!-- rows of seats, receding -->
  <g fill="none" stroke="#c5bfae" stroke-width="1.4">
    <path d="M60 190 q16 -13 32 0M104 190 q16 -13 32 0M148 190 q16 -13 32 0M192 190 q16 -13 32 0M236 190 q16 -13 32 0M280 190 q16 -13 32 0M324 190 q16 -13 32 0"/>
  </g>
  <g fill="none" stroke="#101216" stroke-width="1.4" opacity=".75">
    <path d="M44 220 q18 -15 36 0M92 220 q18 -15 36 0M140 220 q18 -15 36 0M188 220 q18 -15 36 0M236 220 q18 -15 36 0M284 220 q18 -15 36 0M332 220 q18 -15 36 0"/>
  </g>
  <g fill="none" stroke="#101216" stroke-width="1.5">
    <path d="M28 252 q20 -17 40 0M80 252 q20 -17 40 0M132 252 q20 -17 40 0M184 252 q20 -17 40 0M236 252 q20 -17 40 0M288 252 q20 -17 40 0M340 252 q20 -17 40 0"/>
  </g>
</svg>
