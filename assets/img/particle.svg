<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Cartoon Feynman diagram: an electron and a positron meet, exchange a photon and become a quark pair, while a dark matter ghost peeks in">
  <title>Particle theory</title>
  <rect width="480" height="300" fill="#fbfaf6"/>

  <!-- the diagram the particles travel along -->
  <g fill="none" stroke="#101216" stroke-width="2.2" stroke-linecap="round">
    <path d="M40 58 L178 150"/><path d="M40 242 L178 150"/>
    <path d="M300 150 L440 58"/><path d="M300 150 L440 242"/>
  </g>
  <path d="M178 150 q7.6 -14 15.2 0 t15.2 0 t15.2 0 t15.2 0 t15.2 0 t15.2 0 t15.2 0 t15.2 0"
        fill="none" stroke="#1d3557" stroke-width="3" stroke-linecap="round"/>
  <g fill="#101216">
    <path d="M136 122 l-17 -3 l9 15 z"/><path d="M114 192 l14 -1 l-9 -13 z"/>
    <path d="M362 109 l4 -15 l11 12 z"/><path d="M358 188 L366.7 202.2 L374.3 190.4 Z"/>
  </g>
  <!-- sparks at the two vertices -->
  <g stroke="#8a6a24" stroke-width="2" stroke-linecap="round">
    <path d="M178 128 v-8 M162 136 l-6 -6 M194 136 l6 -6"/>
    <path d="M300 128 v-8 M284 136 l-6 -6 M316 136 l6 -6"/>
  </g>
  <g fill="#101216" stroke="#fbfaf6" stroke-width="2">
    <circle cx="178" cy="150" r="5.5"/><circle cx="300" cy="150" r="5.5"/>
  </g>
  <text x="239" y="182" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#1d3557">γ</text>

  <!-- electron, running in -->
  <g transform="translate(78 82)">
    <circle r="22" fill="#f3dfe1" stroke="#7d1f2c" stroke-width="2.6"/>
    <circle cx="-7" cy="-3" r="2.6" fill="#101216"/><circle cx="7" cy="-3" r="2.6" fill="#101216"/>
    <path d="M-7 7 Q0 13 7 7" fill="none" stroke="#101216" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="-27" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#7d1f2c">e⁻</text>
  </g>
  <!-- positron, running in -->
  <g transform="translate(78 218)">
    <circle r="22" fill="#dfe6ef" stroke="#1d3557" stroke-width="2.6"/>
    <circle cx="-7" cy="-3" r="2.6" fill="#101216"/><circle cx="7" cy="-3" r="2.6" fill="#101216"/>
    <path d="M-7 7 Q0 13 7 7" fill="none" stroke="#101216" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="40" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1d3557">e⁺</text>
  </g>
  <g fill="none" stroke="#101216" stroke-width="1.6" stroke-linecap="round" opacity=".45">
    <path d="M42 76 h-14 M44 88 h-10"/><path d="M42 212 h-14 M44 224 h-10"/>
  </g>

  <!-- quark, flying out happy -->
  <g transform="translate(404 82)">
    <circle r="20" fill="#f1e6cf" stroke="#8a6a24" stroke-width="2.6"/>
    <path d="M-10 -3 q3 -4 6 0 M4 -3 q3 -4 6 0" fill="none" stroke="#101216" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8 6 Q0 15 8 6 Z" fill="#7d1f2c" stroke="#101216" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="0" y="-26" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#8a6a24">q</text>
  </g>

  <!-- antiquark, flying out the other way -->
  <g transform="translate(404 218)">
    <circle r="20" fill="#f1e6cf" stroke="#8a6a24" stroke-width="2.6"/>
    <circle cx="-7" cy="-3" r="2.6" fill="#101216"/><circle cx="7" cy="-3" r="2.6" fill="#101216"/>
    <path d="M-7 7 Q0 13 7 7" fill="none" stroke="#101216" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="38" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#8a6a24">q̄</text>
  </g>

  <!-- dark matter ghost peeking in: is it there? -->
  <g transform="translate(240 246)">
    <path d="M-20 18 V-2 A20 20 0 0 1 20 -2 V18 l-6 -5 l-7 5 l-7 -5 l-7 5 l-6 -5 z"
          fill="#fbfaf6" fill-opacity=".6" stroke="#1d3557" stroke-width="2.2" stroke-dasharray="5 4" stroke-linejoin="round"/>
    <circle cx="-6" cy="-2" r="2.8" fill="#1d3557"/><circle cx="6" cy="-2" r="2.8" fill="#1d3557"/>
    <ellipse cx="0" cy="9" rx="3.2" ry="4" fill="#1d3557"/>
    <text x="28" y="-8" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#7d1f2c">?</text>
  </g>
</svg>
