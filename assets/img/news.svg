<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Line drawing of a noticeboard with pinned announcements">
  <title>News and announcements</title>
  <rect width="420" height="260" fill="#fbfaf6"/>

  <!-- board -->
  <rect x="30" y="24" width="360" height="206" rx="3" fill="#f4f2ea" stroke="#101216" stroke-width="1.5"/>
  <rect x="30" y="24" width="360" height="206" rx="3" fill="none" stroke="#c5bfae" stroke-width="5" opacity=".5"/>

  <!-- notice 1 -->
  <g transform="rotate(-2.2 128 96)">
    <rect x="58" y="48" width="140" height="96" fill="#ffffff" stroke="#101216" stroke-width="1.2"/>
    <g stroke="#7d1f2c" stroke-width="2.4"><path d="M72 68h58"/></g>
    <g stroke="#c5bfae" stroke-width="1.4">
      <path d="M72 84h112M72 96h112M72 108h96M72 120h104M72 132h64"/>
    </g>
    <circle cx="128" cy="48" r="4" fill="#7d1f2c"/>
  </g>

  <!-- notice 2 -->
  <g transform="rotate(1.8 292 100)">
    <rect x="222" y="56" width="140" height="82" fill="#ffffff" stroke="#101216" stroke-width="1.2"/>
    <g stroke="#1d3557" stroke-width="2.4"><path d="M236 76h44"/></g>
    <g stroke="#c5bfae" stroke-width="1.4">
      <path d="M236 92h112M236 104h112M236 116h84"/>
    </g>
    <circle cx="292" cy="56" r="4" fill="#1d3557"/>
  </g>

  <!-- notice 3, a schedule card -->
  <g transform="rotate(-1.2 210 190)">
    <rect x="130" y="156" width="160" height="60" fill="#ffffff" stroke="#101216" stroke-width="1.2"/>
    <path d="M130 172h160" stroke="#101216" stroke-width="1.1"/>
    <g stroke="#c5bfae" stroke-width="1.2">
      <path d="M156 172v44M182 172v44M208 172v44M234 172v44M260 172v44M130 194h160"/>
    </g>
    <rect x="184" y="176" width="22" height="14" fill="#8a6a24" fill-opacity=".25" stroke="#8a6a24" stroke-width="1"/>
    <rect x="210" y="198" width="22" height="14" fill="#7d1f2c" fill-opacity=".2" stroke="#7d1f2c" stroke-width="1"/>
    <circle cx="210" cy="156" r="4" fill="#8a6a24"/>
  </g>
</svg>
