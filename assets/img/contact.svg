<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Line drawing of a letter travelling towards a university building">
  <title>Contact</title>
  <rect width="420" height="260" fill="#fbfaf6"/>

  <!-- department building: a colonnade -->
  <g fill="none" stroke="#101216" stroke-width="1.4">
    <path d="M232 112 L318 76 L404 112" fill="#f4f2ea"/>
    <path d="M240 112h156v104H240z" fill="#f4f2ea"/>
    <path d="M232 216h172"/>
  </g>
  <g fill="none" stroke="#101216" stroke-width="1.2">
    <path d="M258 124v82M286 124v82M314 124v82M342 124v82M370 124v82"/>
    <path d="M246 124h144" stroke-width="1.4"/>
  </g>
  <g fill="none" stroke="#c5bfae" stroke-width="1.1">
    <path d="M246 150h144M246 180h144"/>
  </g>
  <!-- steps -->
  <g fill="none" stroke="#101216" stroke-width="1.2">
    <path d="M296 216v10h44v-10M290 232h56"/>
  </g>
  <!-- pediment mark -->
  <circle cx="318" cy="98" r="5" fill="none" stroke="#7d1f2c" stroke-width="1.3"/>

  <!-- envelope -->
  <g transform="rotate(-8 96 150)">
    <rect x="30" y="112" width="132" height="84" rx="2" fill="#ffffff" stroke="#101216" stroke-width="1.5"/>
    <path d="M30 112 L96 162 L162 112" fill="none" stroke="#101216" stroke-width="1.3"/>
    <path d="M30 196 L78 150M162 196 L114 150" fill="none" stroke="#c5bfae" stroke-width="1.2"/>
    <!-- stamp -->
    <rect x="128" y="118" width="26" height="20" fill="none" stroke="#7d1f2c" stroke-width="1.1" stroke-dasharray="3 2"/>
    <circle cx="141" cy="128" r="5" fill="none" stroke="#7d1f2c" stroke-width="1"/>
  </g>

  <!-- flight path from envelope to building -->
  <path d="M172 120 C206 76 232 70 262 92" fill="none" stroke="#1d3557"
        stroke-width="1.3" stroke-dasharray="6 5" stroke-linecap="round"/>
  <path d="M262 92 l-12 -3 3 11 z" fill="#1d3557"/>
</svg>
